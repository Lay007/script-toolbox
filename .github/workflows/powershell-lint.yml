name: PowerShell lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run analyzer diagnostics
        shell: pwsh
        run: |
          $allResults = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning
          $allResults | Format-Table -AutoSize

          $errors = @($allResults | Where-Object { $_.Severity -eq 'Error' })
          if ($errors.Count -gt 0) {
            $errors | Format-Table -AutoSize
            throw "PSScriptAnalyzer found error-level issues."
          }

          Write-Host "PSScriptAnalyzer completed: $($allResults.Count) warning(s), 0 error(s)."
